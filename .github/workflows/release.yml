name: Release VSIX Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Workspace Structure
        run: npm run setup

      - name: Compile TypeScript Modules
        run: npm run build

      - name: Run Quality Audit & Unit Test Suite
        run: npm test

      - name: Package VSIX Extension
        run: npm run package

      - name: Publish GitHub Release with VSIX Asset
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name || inputs.tag_name }}
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: '*.vsix'
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
