name: Jules Companion CI

on:
  push:
    branches:
      - main
      - 'jules/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Audit & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript Scripts
        run: npm run build

      - name: Setup Workspace Structure
        run: npm run setup

      - name: Run Test Suite & TSDoc Coverage Audit
        run: npm test

      - name: Package VSIX Extension
        run: npm run package

      - name: Upload VSIX Artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jules-companion-vsix
          path: '*.vsix'
          if-no-files-found: error
